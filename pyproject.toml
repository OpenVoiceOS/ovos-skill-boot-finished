[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-boot-finished"
description = "OVOS finished booting skill"
readme = "README.md"
authors = [
    { name = "OpenVoiceOS", email = "jarbasai@mailfence.com" }
]
license = { text = "Apache2.0" }
keywords = ["ovos", "skill", "plugin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ovos-bus-client>=2.11.15a1",
    "ovos-utils>=0.15.0a1",
    "ovos-workshop>=9.8.0a1",
    "ovos-plugin-manager>=2.12.1a1",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "ovos-bus-client",
    "ovoscope>=0.7.0",
]
dev = [
    "ovos-bus-client",
    "ovoscope>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-boot-finished"

[project.entry-points."ovos.plugin.skill"]
"ovos-skill-boot-finished.openvoiceos" = "ovos_skill_boot_finished:BootFinishedSkill"

[tool.setuptools]
package-dir = { "ovos_skill_boot_finished" = "" }
packages = ["ovos_skill_boot_finished"]

[tool.setuptools.package-data]
"ovos_skill_boot_finished" = ["*.json", "locale/**"]

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }
